# =============================================================================
# Copier Template: Dart/Flutter FRB (Flutter Rust Bridge) Wrapper
# =============================================================================
# Copier template for creating Dart/Flutter packages that wrap native Rust
# libraries using Flutter Rust Bridge with full CI/CD support.
#
# Usage:
#   mkdir my_package && cd my_package
#   copier copy https://github.com/djx-y-z/copier-dart-frb-wrapper .
#
# Requirements:
#   pip install copier jinja2-strcase
# =============================================================================

# 9.3.1, not 9.0.0: the generated project's update path passes `--skip-tasks`,
# which copier added in 9.2.0 and only wired through the CLI correctly in 9.3.1.
_min_copier_version: "9.3.1"
_subdirectory: template
_templates_suffix: .jinja

# Jinja2 extensions for case conversion
_jinja_extensions:
  - jinja2_strcase.StrcaseExtension

# =============================================================================
# Exclude files conditionally
# =============================================================================
# Written once, then owned by the generated project. `changelog-scope.md` is
# the prompt's statement of what this wrapper binds and exposes — the one thing
# about a project that no answer here can hold, and the thing every automatic
# CHANGELOG entry is classified against. Regenerating it on update would either
# throw away the project's own version or raise a conflict on every release.
# Absent from a destination it is recreated, so an existing project picks it up
# on its next update.
_skip_if_exists:
  - ".github/agent-prompts/changelog-scope.md"

_exclude:
  - copier.yml
  - copier.yaml
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - "~*"

# =============================================================================
# VARIABLES
# =============================================================================

# -----------------------------------------------------------------------------
# Required - Package info
# -----------------------------------------------------------------------------
package_name:
  type: str
  help: "Package name (lowercase, no spaces, e.g., my_signal_lib)"
  validator: >-
    {% if not package_name %}
    package_name is required
    {% elif not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Must be lowercase, start with a letter, contain only letters, numbers, underscores. Got: "{{ package_name }}"
    {% endif %}

description:
  type: str
  help: "Package description for pubspec.yaml"
  validator: "{% if not description %}description is required{% endif %}"

native_library_name:
  type: str
  help: "Name of the native library (e.g., signal_protocol, libsodium)"
  validator: "{% if not native_library_name %}native_library_name is required{% endif %}"

github_repo:
  type: str
  help: "GitHub repository of your wrapper package (username/repo_name)"
  validator: >-
    {% if not github_repo %}
    github_repo is required
    {% elif not (github_repo | regex_search('^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$')) %}
    Must be in format "username/repo_name". Got: "{{ github_repo }}"
    {% endif %}

native_repo:
  type: str
  help: "GitHub repository of the native library (username/repo_name, e.g., nickvision/libnick)"
  validator: >-
    {% if not native_repo %}
    native_repo is required
    {% elif not (native_repo | regex_search('^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$')) %}
    Must be in format "username/repo_name". Got: "{{ native_repo }}"
    {% endif %}

# -----------------------------------------------------------------------------
# Rust crate configuration
# -----------------------------------------------------------------------------
crate_name:
  type: str
  help: "Rust crate name for the FRB wrapper"
  default: "{{ package_name }}_frb"

rust_edition:
  type: str
  help: "Rust edition"
  choices:
    - "2021"
    - "2024"
  default: "2024"

rust_version:
  type: str
  help: "Minimum Rust version (MSRV)"
  default: "1.88"

# -----------------------------------------------------------------------------
# Flutter Rust Bridge configuration
# -----------------------------------------------------------------------------
frb_version:
  type: str
  help: >-
    Flutter Rust Bridge version — exact, no range operator. The generated
    bindings record the version that produced them and the runtime asserts
    equality, so a range breaks the day the next FRB is published.
  default: "2.13.0"
  validator: >-
    {% if not (frb_version | regex_search('^\\^?\\d+\\.\\d+\\.\\d+$')) %}
    Must be X.Y.Z (a leading ^ is stripped). Got: "{{ frb_version }}".
    Three components are required — the pubspec upper bound is computed as the
    next patch, so "2.12" cannot be rendered at all. A pre-release such as
    2.13.0-beta.1 is rejected for a subtler reason: it has no well-defined next
    patch, and the bound that would be computed admits the final release too.
    {% endif %}

# -----------------------------------------------------------------------------
# Upstream Rust crates (optional)
# -----------------------------------------------------------------------------
upstream_crates:
  type: str
  help: "Comma-separated list of upstream Rust crates, all from native_repo (e.g., 'libsignal-protocol' for single crate, or 'libsignal-protocol,libsignal-core' for multiple). The first is the primary crate: its version is the one upstream_version records and the update check follows. Leave empty if not wrapping an upstream crate."
  default: ""

forbidden_features:
  type: str
  help: |
    Cargo features that must never be enabled in the SHIPPED dependency graph,
    as 'crate=feat1,feat2;crate2=feat3'. Leave empty for no gate.

    Keyed by crate on purpose. A flat list of feature names cannot express this:
    the same feature name is usually legitimate on a neighbouring crate, so such
    a list is red on a healthy tree. Example, from the project this came from:
    'openmls=test-utils,backtrace' — both leak a symbolized backtrace into the
    ordinary error channel out to the Dart caller — while openmls_basic_credential
    carries test-utils deliberately and allo-isolate brings its own backtrace.

    Empty renders NO gate at all, rather than a gate with nothing to check: a
    check that passes because it looked at nothing is not a check.
  default: ""

# Where the upstream crates come from. Asked before the pin, because what a
# valid pin looks like depends on it.
#
# The values are permanent: an answers file keeps them for as long as the
# project exists, so a new source is added beside these, never by renaming one.
# That is why the git one is `git_tag` and not `git` — a git dependency pinned
# by commit would be a different source with a different pin. Everything that
# depends on the answer lives in two places, `macros/upstream.jinja` for the
# rendered files and `template/scripts/src/upstream_source.dart.jinja` for the
# scripts, which compile every source into every project and pick one.
upstream_source:
  type: str
  help: >-
    Where the upstream crates come from. git_tag: a git dependency on
    native_repo pinned by tag; upstream_version is the tag, and new releases are
    found through native_repo's GitHub Releases. crates_io: the crates.io
    registry; upstream_version is the exact version of the primary crate, new
    releases are found on crates.io whatever upstream names its tags, and every
    other upstream crate follows the requirement the primary itself declares.
  choices:
    "git tag of native_repo": git_tag
    "crates.io registry": crates_io
  default: git_tag
  when: "{{ upstream_crates != '' }}"

# -----------------------------------------------------------------------------
# Version tag prefix
# -----------------------------------------------------------------------------
version_tag_prefix:
  type: str
  help: "Tag prefix for upstream version tags (e.g., 'v' for tags like v1.0.0, 'release-v' for tags like release-v1.0.0). Used to normalize versions for comparison and prerelease detection."
  default: "v"
  when: "{{ upstream_crates != '' and upstream_source == 'git_tag' }}"

upstream_version:
  type: str
  help: >-
    The upstream pin. With upstream_source=git_tag, the tag (e.g., v1.0.0).
    With upstream_source=crates_io, the exact crates.io version of the primary
    crate, with no prefix (e.g., 1.0.0).
  default: ""
  when: "{{ upstream_crates != '' }}"
  # The same forms the update check accepts (`validatePin` in
  # scripts/src/upstream_source.dart), so a pin it would refuse on its first
  # scheduled run is refused here instead, while the answer is still in front of
  # whoever typed it.
  validator: >-
    {% if upstream_source == 'crates_io' %}
    {%- if not (upstream_version | regex_search('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$')) %}
    With upstream_source=crates_io this is the exact crates.io version of the
    primary crate, X.Y.Z with no tag prefix. Got: "{{ upstream_version }}"
    {%- endif %}
    {%- elif not upstream_version.startswith(version_tag_prefix) or not (upstream_version[version_tag_prefix | length:] | regex_search('^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$')) %}
    With upstream_source=git_tag this is the upstream tag, {{ version_tag_prefix }}X.Y.Z
    (version_tag_prefix followed by a version). Got: "{{ upstream_version }}"
    {% endif %}

# The requirement on every upstream crate after the first, which with a registry
# source cannot be derived from upstream_version: a workspace's crates are
# versioned independently. The update check rewrites it on every bump, from the
# requirements the primary crate's own release declares on crates.io.
upstream_crate_versions:
  type: str
  help: >-
    The version requirement on every upstream crate after the first, as
    'crate=X.Y.Z,crate2=X.Y.Z' — what the primary crate itself requires of
    each. A leading '=' pins exactly; without one the requirement is Cargo's
    default caret range, the same one the primary crate declares.
  default: ""
  when: "{{ upstream_crates != '' and upstream_source == 'crates_io' and (upstream_crates.split(',') | map('trim') | select | list | length) > 1 }}"
  validator: >-
    {%- set _companions = upstream_crates.split(',') | map('trim') | select | list -%}
    {%- set _companions = _companions[1:] -%}
    {%- set _entries = upstream_crate_versions.split(',') | map('trim') | select | list -%}
    {%- set _names = _entries | map('regex_replace', '=.*$', '') | map('trim') | list -%}
    {%- if (_names | sort | list) != (_companions | sort | list) %}
    Give exactly one requirement for each of: {{ _companions | join(', ') }}.
    Got requirements for: {{ _names | join(', ') or 'none' }}
    {%- else %}
    {%- for _entry in _entries %}
    {%- if not (_entry | regex_search('^[A-Za-z0-9_-]+\\s*=\\s*=?(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?)?)?$')) %}
    "{{ _entry }}" is not crate=X.Y.Z.
    {%- endif %}
    {%- endfor %}
    {%- endif %}

enable_upstream_advisories:
  type: bool
  help: >-
    Check native_repo's published GitHub security advisories against the
    upstream crates rust/Cargo.lock resolves (make check-upstream-advisories),
    daily beside the update check: a locked version an advisory covers, or a
    check that could not run, turns the scheduled run red. An upstream that
    publishes advisories only in its own repository reaches neither RustSec,
    which make rust-audit reads, nor GitHub's global database, which Dependabot
    reads, until someone files it there.
  default: true
  when: "{{ upstream_crates != '' }}"

# -----------------------------------------------------------------------------
# Web/WASM support
# -----------------------------------------------------------------------------
enable_web:
  type: bool
  help: "Enable Web/WASM support"
  default: true

# -----------------------------------------------------------------------------
# freezed (only needed by some FRB API shapes)
# -----------------------------------------------------------------------------
enable_freezed:
  type: bool
  help: "Add freezed to the generated project. flutter_rust_bridge needs it only when the Rust API has data-carrying enums or structs it renders as sealed classes; a project whose API has none carries three dependencies and a build_runner step for nothing. Turn it off and turn it back on the first time codegen emits a `@freezed` class."
  default: true

# -----------------------------------------------------------------------------
# Protocol Buffers support (optional)
# -----------------------------------------------------------------------------
enable_protoc:
  type: bool
  help: "Enable Protocol Buffers support (install protoc in setup/CI)"
  default: false

# -----------------------------------------------------------------------------
# Fuzzing support (cargo-fuzz)
# -----------------------------------------------------------------------------
enable_fuzzing:
  type: bool
  help: "Include a cargo-fuzz harness (rust/fuzz/, Fuzz CI workflow, Makefile targets). Recommended for libraries that parse untrusted bytes."
  default: true

# -----------------------------------------------------------------------------
# Claude Code support
# -----------------------------------------------------------------------------
enable_claude:
  type: bool
  help: "Include Claude Code configuration (CLAUDE.md, .claude/skills/, .claude/commands/)"
  default: true

# -----------------------------------------------------------------------------
# Flutter/Dart versions
# -----------------------------------------------------------------------------
flutter_version:
  type: str
  help: "Flutter version for FVM"
  default: "3.38.4"

dart_sdk_version:
  type: str
  help: "Dart SDK version constraint"
  default: "^3.10.0"

flutter_sdk_version:
  type: str
  help: "Flutter SDK version constraint"
  default: ">=3.38.0"

# -----------------------------------------------------------------------------
# iOS config
# -----------------------------------------------------------------------------
ios_min_version:
  type: str
  help: "iOS minimum deployment target"
  default: "13.0"

# -----------------------------------------------------------------------------
# macOS config
# -----------------------------------------------------------------------------
macos_min_version:
  type: str
  help: "macOS minimum deployment target"
  default: "10.15"

# -----------------------------------------------------------------------------
# Android config
# -----------------------------------------------------------------------------
android_min_sdk:
  type: str
  help: "Android minimum SDK version"
  default: "24"

android_compile_sdk:
  type: str
  help: "Android compile SDK version"
  default: "36"

# r28 (Clang 19), not r26 (Clang 17). Anything that vendors OpenSSL 3.6 — and
# rusqlite reaches it through `openssl-src` the moment
# `bundled-sqlcipher-vendored-openssl` is on — ships `crypto/sm3/sm3-x86_64.S`,
# whose Intel SM3 instructions Clang 17 cannot assemble. Measured on the
# assembler itself: r27's Clang 18 and r28's Clang 19 both take it, r26's
# Clang 17 does not. A project left on r26 is green on every other gate and
# fails only when it cross-compiles Android — which, since the native build
# runs on a release tag rather than on main, means it fails in stage 1 of a
# release rather than in the pull request that caused it.
android_ndk_version:
  type: str
  help: "Android NDK version for Rust cross-compilation (r28+; older NDKs cannot assemble OpenSSL 3.6)"
  default: "28.2.13676358"

android_gradle_version:
  type: str
  help: "Android Gradle plugin version"
  default: "8.11.1"

android_java_version:
  type: str
  help: "Java version for Android compilation"
  choices:
    - "11"
    - "17"
    - "21"
  default: "17"

# -----------------------------------------------------------------------------
# License
# -----------------------------------------------------------------------------
license:
  type: str
  help: "Package license"
  choices:
    - MIT
    - AGPL-3.0
    - Apache-2.0
    - BSD-3-Clause
  default: MIT

# Year of first publication, used in the LICENSE copyright line as
# "<year>-present". Deliberately a stored answer rather than a rendered "now":
# the notice must keep naming the year the work was first published, so
# re-rendering it in a later year must not move it.
copyright_year:
  type: str
  help: "Year of FIRST publication for the LICENSE copyright line (set this — the default is not the current year)"
  default: "2026"
  validator: >-
    {% if not (copyright_year | regex_search('^\d{4}$')) %}
    Must be a four-digit year. Got: "{{ copyright_year }}"
    {% endif %}

# -----------------------------------------------------------------------------
# Topics
# -----------------------------------------------------------------------------
topics:
  type: str
  help: "Package topics for pub.dev (comma-separated, max 5, e.g., cryptography,ffi,native)"
  default: "ffi,native,rust"
  validator: "{% if topics.split(',') | map('trim') | select | list | length > 5 %}Maximum 5 topics allowed (pub.dev limit){% endif %}"

# =============================================================================
# POST-GENERATION TASKS
# =============================================================================
_tasks:
  # Initialize git repository
  - command: git init

  # Create Flutter example app
  # Note: --project-name=example creates applicationId=com.{package_name}.example
  # and Kotlin path com/{package_name}/example/MainActivity.kt
  - command: >-
      flutter create example
      --platforms=android,ios,linux,macos,windows{% if enable_web %},web{% endif %}
      --project-name example
      --org com.{{ package_name }}

  # Copy template files to example and remove default widget_test.dart
  - command: >-
      cp _templates/example_pubspec.yaml example/pubspec.yaml &&
      cp _templates/example_main.dart example/lib/main.dart &&
      cp _templates/example_gitignore example/.gitignore &&
      cp _templates/example_ios_debug.xcconfig example/ios/Flutter/Debug.xcconfig &&
      cp _templates/example_ios_release.xcconfig example/ios/Flutter/Release.xcconfig &&
      cp _templates/example_macos_debug.xcconfig example/macos/Flutter/Flutter-Debug.xcconfig &&
      cp _templates/example_macos_release.xcconfig example/macos/Flutter/Flutter-Release.xcconfig &&
      cp _templates/example_widget_test.dart example/test/widget_test.dart

  # Create CLI example app
  - command: dart create -t console example_cli --force

  # Copy template files to example_cli and cleanup (remove default test and lib)
  - command: >-
      cp _templates/example_cli_pubspec.yaml example_cli/pubspec.yaml &&
      cp _templates/example_cli_main.dart example_cli/bin/main.dart &&
      cp _templates/example_cli_gitignore example_cli/.gitignore &&
      cp _templates/example_cli_analysis_options.yaml example_cli/analysis_options.yaml &&
      rm -f example_cli/bin/example_cli.dart &&
      rm -rf example_cli/test example_cli/lib

  # Get dependencies for example_cli (after pubspec.yaml replacement)
  - command: dart pub get
    working_directory: example_cli

  # Remove _templates directory
  - command: rm -rf _templates

  # Remove Claude files when enable_claude is false
  - command: rm -rf CLAUDE.md .claude
    when: "{{ not enable_claude }}"

  # Remove fuzzing files when enable_fuzzing is false
  - command: rm -rf rust/fuzz .github/workflows/fuzz.yml
    when: "{{ not enable_fuzzing }}"

  # The app-store additional permission only makes sense for AGPL
  - command: rm -f LICENSE.appstore
    when: "{{ license != 'AGPL-3.0' }}"

  # Format generated Dart code
  - command: dart format .

# =============================================================================
# Messages
# =============================================================================
_message_after_copy: |

  FRB wrapper generated successfully!

  Package: {{ package_name }}
  Crate: {{ crate_name }}
  {% if upstream_crates %}Upstream: {{ upstream_crates }} @ {{ upstream_version }}{% endif %}

  Next steps:

  1. Your package is ready at:
     {{ _copier_conf.dst_path }}

  2. Add native library license:
     Copy the license file from the native library to:
     LICENSE_NATIVE or include in LICENSE

  3. Install dependencies and setup:
     make setup

  4. Generate Dart bindings:
     make codegen

  5. Build native libraries:
     make build

  6. Generate the third-party notice inventory (needs step 5's Cargo.lock):
     make third-party-notices
     A fresh package has no THIRD_PARTY_NOTICES.txt, and CI verifies the
     committed file against the dependency graph, so the first CI run fails
     until you generate and commit it. `make rust-update` regenerates it too.

  7. Verify everything works:
     make analyze         # Dart static analysis (should be clean)
     make rust-check      # Rust type check
     make test            # Run tests (should pass)

  8. Implement your Rust API in rust/src/api/
     Add your FRB-annotated functions here

  9. Regenerate bindings after Rust changes:
     make codegen

  10. Implement your Dart API in lib/src/

  11. Update example apps in example/ and example_cli/

  12. Write tests in test/ directory
      See test/{{ package_name }}_test.dart for template

  13. Customize package metadata:
      - Update topics in pubspec.yaml if needed
      - Add topics in GitHub repository settings
      - Review and update SECURITY.md with your contact information

  14. Configure GitHub Actions. Nothing below has a default: a workflow that
      writes into your repository, or spends money, is named by you or does
      not run. Every one of these degrades to a notice rather than a red run.
      - GitHub App for signed commits, and for the pull requests and issues
        the automation opens:
          variable APP_CLIENT_ID   (the App's Client ID, not its numeric ID)
          secret   APP_PRIVATE_KEY
      - Coverage badge:
          secret   GIST_TOKEN
          variable COVERAGE_GIST_ID
      - AI changelog entries on update pull requests:
          variable AI_MODELS        ordered `provider/model` list, first one
                   with a key wins. No default: unset means no model is called
                   and the entry is left for a human.
          secret   ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY,
                   one per provider named in AI_MODELS
          variable AI_EFFORT        low|medium|high|xhigh|max (default medium)
        Then edit .github/agent-prompts/changelog-scope.md to say what this
        package binds and exposes — every entry is classified against it.
      - Repair and review agents (repair-build.yml, ai-review.yml):
          variable AGENT_ENGINE            'claude-code' or 'opencode'
          variable AGENT_CLAUDECODE_MODEL  or AGENT_OPENCODE_MODEL, matching
          secret   ANTHROPIC_API_KEY       or the provider key OpenCode reads
          variable REVIEW_ALLOWED_BOTS     your App's slug, if bot-authored
                   pull requests should be reviewed on the claude-code engine
        Both agents are off entirely while AGENT_ENGINE is unset.
      See CONTRIBUTING.md for detailed instructions

  15. Harden releases (recommended for native/crypto libraries):
      After creating the GitHub repo and pushing, apply the repository rulesets
      + native-build environment in one command (needs `gh` as a repo admin):
        make setup-repo-protections
      Rulesets live as committed JSON in .github/rulesets/ (edit them there);
      details + optional fields in .github/rulesets/README.md

  For more information, see {% if enable_claude %}CLAUDE.md and {% endif %}README.md

_message_after_update: |

  FRB wrapper updated successfully!

  Review the changes and run:
    make setup
    make codegen
    make build

  If this update created .github/agent-prompts/changelog-scope.md, edit it. It
  states what this package binds and exposes, every automatic CHANGELOG entry is
  classified against it, and no later update will overwrite it — so the generic
  version it arrives with is the version it keeps until you replace it.
